services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bookrag
      POSTGRES_PASSWORD: bookrag
      POSTGRES_DB: bookrag
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookrag -d bookrag"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://bookrag:bookrag@db:5432/bookrag
      MODEL_CACHE_DIR: /app/models
    volumes:
      - modelcache:/app/models
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  modelcache:
