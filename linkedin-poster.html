<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedIn Post Generator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #222222;
    --accent: #00ff88;
    --accent-dim: #00ff8822;
    --danger: #ff3b3b;
    --text: #e8e8e8;
    --muted: #555;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Nav ── */
  .nav {
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .nav-brand {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.5px;
    padding: 12px 24px;
    border-right: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
  }

  .nav-link {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 14px 20px;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.15s;
    border-right: 1px solid var(--border);
  }
  .nav-link:hover { color: var(--text); }
  .nav-link.active { color: var(--accent); }

  /* ── Layout ── */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 49px);
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .sidebar-header span {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .sidebar-new-btn {
    width: 24px;
    height: 24px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: all 0.15s;
  }
  .sidebar-new-btn:hover { border-color: var(--accent); color: var(--accent); }

  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .sidebar-list::-webkit-scrollbar { width: 4px; }
  .sidebar-list::-webkit-scrollbar-track { background: transparent; }
  .sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .prompt-item {
    padding: 10px 16px;
    cursor: pointer;
    border-left: 2px solid transparent;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s;
    min-height: 44px;
  }
  .prompt-item:hover { background: rgba(255,255,255,0.03); }
  .prompt-item.active {
    border-left-color: var(--accent);
    background: var(--accent-dim);
  }
  .prompt-item-name {
    font-size: 12px;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }
  .prompt-item.active .prompt-item-name { color: var(--accent); }
  .prompt-item-actions {
    display: none;
    gap: 2px;
    flex-shrink: 0;
  }
  .prompt-item:hover .prompt-item-actions { display: flex; }
  .prompt-item-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 5px;
    border-radius: 2px;
    font-family: 'JetBrains Mono', monospace;
    transition: all 0.1s;
  }
  .prompt-item-btn:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .prompt-item-btn.del:hover { color: var(--danger); background: rgba(255,59,59,0.1); }

  .sidebar-empty {
    padding: 24px 16px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
  }

  /* ── Main ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
    overflow-y: auto;
  }

  header {
    width: 100%;
    max-width: 720px;
    margin-bottom: 48px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
  }

  header span {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .card {
    width: 100%;
    max-width: 720px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    margin-bottom: 24px;
  }

  .card-header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-header-title {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .active-prompt-tag {
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    padding: 2px 8px;
    border-radius: 2px;
    text-transform: none;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-body { padding: 20px; }

  textarea, input[type="text"] {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    outline: none;
  }

  textarea { resize: vertical; min-height: 160px; }
  input[type="text"] { border-bottom: 1px solid var(--border); padding-bottom: 8px; }

  textarea::placeholder, input::placeholder { color: var(--muted); }

  .btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 12px 24px;
    border: 1px solid;
    cursor: pointer;
    background: transparent;
    transition: all 0.15s;
    border-radius: 2px;
  }

  .btn-primary { border-color: var(--accent); color: var(--accent); }
  .btn-primary:hover:not(:disabled) { background: var(--accent); color: #000; }
  .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-secondary { border-color: var(--muted); color: var(--muted); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--text); color: var(--text); }
  .btn-secondary:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-approve { border-color: var(--accent); color: var(--accent); flex: 1; }
  .btn-approve:hover:not(:disabled) { background: var(--accent); color: #000; }
  .btn-approve:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-reject { border-color: var(--danger); color: var(--danger); flex: 1; }
  .btn-reject:hover { background: var(--danger); color: #fff; }

  .btn-save { border-color: var(--muted); color: var(--muted); font-size: 11px; padding: 8px 16px; }
  .btn-save:hover { border-color: var(--text); color: var(--text); }

  .actions { display: flex; gap: 12px; margin-top: 20px; align-items: center; }

  .post-output {
    font-size: 14px;
    line-height: 1.8;
    white-space: pre-wrap;
    color: var(--text);
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 8px;
    outline: none;
    transition: border-color 0.2s;
  }
  .post-output:focus {
    border-color: var(--accent);
    background: rgba(255,255,255,0.02);
  }

  .audience-badge {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    padding: 3px 10px;
    border-radius: 2px;
  }

  .post-actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .hidden { display: none; }

  .status-bar {
    width: 100%;
    max-width: 720px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    display: flex;
    justify-content: space-between;
    padding: 0 4px;
  }

  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    margin-right: 8px;
    vertical-align: middle;
  }

  .status-dot.active {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .loading-text::after {
    content: '.';
    animation: dots 1.2s infinite;
  }

  @keyframes dots {
    0% { content: '.'; }
    33% { content: '..'; }
    66% { content: '...'; }
  }

  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 12px 24px;
    font-size: 12px;
    letter-spacing: 1px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    border-radius: 2px;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--accent); color: var(--accent); }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  .word-count { font-size: 10px; color: var(--muted); letter-spacing: 1px; }

  .divider {
    width: 100%;
    max-width: 720px;
    border: none;
    border-top: 1px solid var(--border);
    margin: 8px 0 24px;
  }
</style>
</head>
<body>

<!-- ── Nav ── -->
<nav class="nav">
  <span class="nav-brand">PostGen</span>
  <a href="linkedin-poster.html" class="nav-link active">Post Generator</a>
  <a href="book-rag.html" class="nav-link">Book RAG</a>
</nav>

<!-- ── Layout ── -->
<div class="layout">

<!-- ── Sidebar ── -->
<aside class="sidebar">
  <div class="sidebar-header">
    <span>Prompts</span>
    <button class="sidebar-new-btn" onclick="newPrompt()" title="New prompt">+</button>
  </div>
  <div class="sidebar-list" id="promptList"></div>
</aside>

<!-- ── Main ── -->
<div class="main">

<header>
  <h1>PostGen</h1>
  <span>LinkedIn · AI</span>
</header>

<div class="card">
  <div class="card-header">
    <div class="card-header-title">
      <span>System Prompt</span>
      <span class="active-prompt-tag hidden" id="activePromptTag"></span>
    </div>
    <button class="btn btn-save" onclick="savePrompt()">Save</button>
  </div>
  <div class="card-body">
    <textarea id="promptInput" placeholder="Select a prompt from the sidebar, or write a new one and hit Save..." style="min-height:180px;"></textarea>
    <div style="margin-top: 8px;">
      <span class="word-count" id="promptWordCount">0 words</span>
    </div>
  </div>
</div>

<div class="card" style="border-color: transparent; background: transparent;">
  <div class="card-body" style="padding: 0;">
    <div class="actions">
      <button class="btn btn-primary" id="generateBtn" onclick="generatePost('gemini')">Generate Post</button>
      <button class="btn btn-secondary" id="generateBtnGrok" onclick="generatePost('grok')">Generate Post (Grok)</button>
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText" style="font-size:11px;color:var(--muted);"></span>
    </div>
  </div>
</div>

<div class="card hidden" id="outputCard">
  <div class="card-header">
    <span>Generated Post</span>
    <span class="audience-badge" id="audienceBadge">—</span>
  </div>
  <div class="card-body">
    <div class="post-output" id="postOutput" contenteditable="true" spellcheck="true"></div>
    <div class="word-count" id="postWordCount" style="margin-top:12px;"></div>
    <div class="post-actions">
      <button class="btn btn-approve" id="approveBtn" onclick="approvePost()">✓ Publish to LinkedIn</button>
      <button class="btn btn-reject" onclick="rejectPost()">✗ Discard</button>
    </div>
  </div>
</div>

<hr class="divider">

<div class="status-bar">
  <span id="savedStatus">No saved prompts</span>
  <span id="apiStatus">—</span>
</div>

</div><!-- /.main -->

</div><!-- /.layout -->

<div class="toast" id="toast"></div>

<script>
  const PROMPTS_KEY = 'linkedin_postgen_prompts';
  const LEGACY_KEY  = 'linkedin_postgen_prompt';
  const PROXY_URL   = 'http://localhost:3001/publish';

  let currentPost     = '';
  let currentAudience = '';
  let activeId        = null;

  // ── Storage helpers ──
  function getPrompts() {
    return JSON.parse(localStorage.getItem(PROMPTS_KEY) || '[]');
  }
  function setPrompts(prompts) {
    localStorage.setItem(PROMPTS_KEY, JSON.stringify(prompts));
  }

  // ── Sidebar render ──
  function renderSidebar() {
    const list    = document.getElementById('promptList');
    const prompts = getPrompts();

    if (!prompts.length) {
      list.innerHTML = '<div class="sidebar-empty">No prompts yet.<br>Write one and hit Save.</div>';
      return;
    }

    list.innerHTML = prompts.map(p => `
      <div class="prompt-item ${p.id === activeId ? 'active' : ''}" onclick="loadPrompt('${p.id}')">
        <span class="prompt-item-name">${escHtml(p.name)}</span>
        <div class="prompt-item-actions">
          <button class="prompt-item-btn" onclick="renamePrompt(event,'${p.id}')" title="Rename">✎</button>
          <button class="prompt-item-btn del" onclick="deletePrompt(event,'${p.id}')" title="Delete">×</button>
        </div>
      </div>
    `).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Active prompt tag ──
  function updateActiveTag(name) {
    const tag = document.getElementById('activePromptTag');
    if (name) {
      tag.textContent = name;
      tag.classList.remove('hidden');
    } else {
      tag.classList.add('hidden');
    }
  }

  // ── Load prompt into textarea ──
  function loadPrompt(id) {
    const prompts = getPrompts();
    const p = prompts.find(x => x.id === id);
    if (!p) return;
    activeId = id;
    document.getElementById('promptInput').value = p.text;
    updatePromptWordCount();
    updateActiveTag(p.name);
    document.getElementById('savedStatus').textContent = `"${p.name}" loaded`;
    renderSidebar();
  }

  // ── New prompt (clear state) ──
  function newPrompt() {
    activeId = null;
    document.getElementById('promptInput').value = '';
    updatePromptWordCount();
    updateActiveTag(null);
    document.getElementById('savedStatus').textContent = 'New prompt — hit Save when ready';
    renderSidebar();
    document.getElementById('promptInput').focus();
  }

  // ── Save ──
  function savePrompt() {
    const text = document.getElementById('promptInput').value.trim();
    if (!text) { showToast('Nothing to save', 'error'); return; }

    const prompts = getPrompts();

    if (activeId) {
      const p = prompts.find(x => x.id === activeId);
      if (p) {
        p.text = text;
        setPrompts(prompts);
        renderSidebar();
        updateActiveTag(p.name);
        document.getElementById('savedStatus').textContent = `"${p.name}" updated ✓`;
        showToast(`"${p.name}" updated ✓`, 'success');
      }
    } else {
      const name = window.prompt('Nombre del prompt:');
      if (!name || !name.trim()) return;
      const id = Date.now().toString();
      prompts.push({ id, name: name.trim(), text });
      setPrompts(prompts);
      activeId = id;
      updateActiveTag(name.trim());
      document.getElementById('savedStatus').textContent = `"${name.trim()}" saved ✓`;
      showToast(`"${name.trim()}" saved ✓`, 'success');
      renderSidebar();
    }
  }

  // ── Rename ──
  function renamePrompt(e, id) {
    e.stopPropagation();
    const prompts = getPrompts();
    const p = prompts.find(x => x.id === id);
    if (!p) return;
    const name = window.prompt('Nuevo nombre:', p.name);
    if (!name || !name.trim()) return;
    p.name = name.trim();
    setPrompts(prompts);
    if (activeId === id) updateActiveTag(p.name);
    renderSidebar();
    showToast(`Renamed to "${p.name}"`, 'success');
  }

  // ── Delete ──
  function deletePrompt(e, id) {
    e.stopPropagation();
    let prompts = getPrompts();
    const p = prompts.find(x => x.id === id);
    if (!window.confirm(`Delete "${p?.name}"?`)) return;
    prompts = prompts.filter(x => x.id !== id);
    setPrompts(prompts);
    if (activeId === id) {
      activeId = null;
      document.getElementById('promptInput').value = '';
      updatePromptWordCount();
      updateActiveTag(null);
      document.getElementById('savedStatus').textContent = `"${p?.name}" deleted`;
    }
    renderSidebar();
    showToast(`"${p?.name}" deleted`, 'error');
  }

  // ── Init ──
  window.onload = () => {
    // Migrate legacy single-prompt
    const legacy = localStorage.getItem(LEGACY_KEY);
    if (legacy && !getPrompts().length) {
      const id = Date.now().toString();
      setPrompts([{ id, name: 'Default', text: legacy }]);
      localStorage.removeItem(LEGACY_KEY);
      loadPrompt(id);
      showToast('Prompt migrated from previous version', 'success');
      return;
    }
    renderSidebar();
    const count = getPrompts().length;
    document.getElementById('savedStatus').textContent = count
      ? `${count} prompt(s) — select one from the sidebar`
      : 'No saved prompts';
  };

  document.getElementById('promptInput').addEventListener('input', updatePromptWordCount);

  function updatePromptWordCount() {
    const words = document.getElementById('promptInput').value.trim().split(/\s+/).filter(Boolean).length;
    document.getElementById('promptWordCount').textContent = `${words} words`;
  }

  // ── Generate ──
  async function generatePost(provider = 'gemini') {
    const prompt = document.getElementById('promptInput').value.trim();
    if (!prompt) { showToast('Add a system prompt first', 'error'); return; }

    const isGrok             = provider === 'grok';
    const endpoint           = isGrok ? 'http://localhost:3001/generate-grok' : 'http://localhost:3001/generate';
    const providerLabel      = isGrok ? 'Grok API' : 'Gemini API';
    const btnGemini          = document.getElementById('generateBtn');
    const btnGrok            = document.getElementById('generateBtnGrok');
    const activeBtn          = isGrok ? btnGrok : btnGemini;
    const activeBtnOrigText  = isGrok ? 'Generate Post (Grok)' : 'Generate Post';

    btnGemini.disabled = true;
    btnGrok.disabled   = true;
    activeBtn.innerHTML = '<span class="loading-text">Generating</span>';
    document.getElementById('statusDot').classList.add('active');
    document.getElementById('statusText').textContent = `Calling ${providerLabel}`;
    document.getElementById('outputCard').classList.add('hidden');

    try {
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt }),
      });

      const data = await response.json();
      if (!response.ok) { showToast('Error: ' + (data.error || 'Unknown'), 'error'); return; }

      currentAudience = data.audience;
      currentPost     = data.post;

      document.getElementById('audienceBadge').textContent   = currentAudience;
      document.getElementById('postOutput').textContent      = currentPost;
      const words = currentPost.trim().split(/\s+/).filter(Boolean).length;
      document.getElementById('postWordCount').textContent   = `${words} words`;
      document.getElementById('outputCard').classList.remove('hidden');
      document.getElementById('apiStatus').textContent       = `Last generated via ${providerLabel}: ${new Date().toLocaleTimeString()}`;

    } catch (err) {
      showToast('Server offline. Run: node server.js', 'error');
    } finally {
      btnGemini.disabled  = false;
      btnGrok.disabled    = false;
      activeBtn.textContent = activeBtnOrigText;
      document.getElementById('statusDot').classList.remove('active');
      document.getElementById('statusText').textContent = '';
    }
  }

  // ── Publish ──
  async function approvePost() {
    const editedPost = document.getElementById('postOutput').innerText.trim();
    if (!editedPost) return;

    const approveBtn = document.getElementById('approveBtn');
    approveBtn.disabled = true;
    approveBtn.innerHTML = '<span class="loading-text">Publishing</span>';

    try {
      const res  = await fetch(PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: editedPost })
      });
      const data = await res.json();

      if (res.ok && data.success) {
        showToast('Published to LinkedIn ✓', 'success');
        document.getElementById('outputCard').classList.add('hidden');
        currentPost = ''; currentAudience = '';
        document.getElementById('apiStatus').textContent = `Published at ${new Date().toLocaleTimeString()}`;
      } else {
        showToast('LinkedIn error: ' + (data.error || 'Unknown'), 'error');
      }
    } catch (err) {
      showToast('Publish error: ' + err.message, 'error');
    } finally {
      approveBtn.disabled     = false;
      approveBtn.textContent  = '✓ Publish to LinkedIn';
    }
  }

  function rejectPost() {
    document.getElementById('outputCard').classList.add('hidden');
    currentPost = ''; currentAudience = '';
    showToast('Post discarded', 'error');
  }

  function showToast(msg, type = 'success') {
    const toast    = document.getElementById('toast');
    toast.textContent = msg;
    toast.className   = `toast ${type} show`;
    setTimeout(() => { toast.className = 'toast'; }, 3000);
  }
</script>
</body>
</html>
